[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/dmitryweiner/sdr-viewer"

[workspace.dependencies]
sdr-core = { path = "crates/sdr-core" }
sdr-tui = { path = "crates/sdr-tui" }
num-complex = "0.4"
ratatui = "0.30"
clap = { version = "4.6", features = ["derive"] }
insta = "1.49"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
