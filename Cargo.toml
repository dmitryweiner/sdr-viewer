[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/dmitryweiner/sdr-viewer"

[workspace.dependencies]
sdr-core = { path = "crates/sdr-core" }
sdr-detect = { path = "crates/sdr-detect" }
sdr-dsp = { path = "crates/sdr-dsp" }
sdr-rtl = { path = "crates/sdr-rtl" }
sdr-store = { path = "crates/sdr-store" }
sdr-tui = { path = "crates/sdr-tui" }
rustfft = "6"
num-complex = "0.4"
ratatui = "0.30"
clap = { version = "4.6", features = ["derive"] }
insta = "1.49"
# Only for the local time zone: std has none.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# SQLite compiled in: the static musl binary has no system library to use.
rusqlite = { version = "0.42", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
